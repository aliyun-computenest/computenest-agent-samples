[project]
name = "knowlage-rag"
version = "0.1.0"
description = "基于 AgentScope + AgentScope Runtime 的百炼知识库检索问答 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentscope>=1.0.0",
    "agentscope-runtime>=1.1.0",
    "alibabacloud-bailian20231229>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
dev-dependencies = []
