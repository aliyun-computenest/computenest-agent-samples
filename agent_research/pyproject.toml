[project]
name = "agent_research"
version = "0.1.0"
description = "AI搜学助手 - 基于 AgentScope 的知识整理智能体"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agentscope>=1.0.0",
    "dashscope",
    "uvicorn",
    "fastapi",
    "pydantic",
    "python-dotenv>=1.0.0",
    "pandas",
    "markdown>=3.10",
    "agentrun-sdk[playwright]>=0.0.5",
    "playwright",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
dev-dependencies = []
